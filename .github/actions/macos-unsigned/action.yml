name: Validate unsigned Apple Silicon app
description: Build and validate an ad-hoc Mac app without Apple credentials
inputs:
  artifact-name:
    description: Name for validated Mac downloads
    default: macos-unsigned
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
    - name: Ensure native build tools
      shell: bash
      run: command -v cmake >/dev/null || brew install cmake
    - uses: actions/cache@v4
      with:
        path: |
          build/whisper-macos
          build/ffmpeg-macos
        key: mac-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-whisper-macos.sh', 'scripts/build-ffprobe-macos.sh', 'scripts/bundle-ffmpeg-macos.sh', 'package-lock.json') }}
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm test
    - shell: bash
      run: npm run lint -- --quiet
    - name: Build unsigned DMG and ZIP
      shell: bash
      env:
        # PR builds still need the credential-free ad-hoc signature (mac.identity: '-').
        CSC_FOR_PULL_REQUEST: 'true'
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        CSC_LINK: ''
        CSC_NAME: ''
      run: npm run build:mac:arm64
    - name: Verify native resources and transcribe speech on CPU
      shell: bash
      run: bash scripts/smoke-macos.sh 2>&1 | tee dist/macos-validation.txt
    - name: Launch packaged desktop and embedded server
      shell: bash
      run: npm run test:mac:app 2>&1 | tee -a dist/macos-validation.txt
    - name: Record Mac dependency licenses
      shell: bash
      run: node scripts/generate-license-notices.mjs dist/MAC_THIRD_PARTY_LICENSES.json
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        if-no-files-found: error
        path: |
          dist/*-mac-arm64-unsigned.dmg
          dist/*-mac-arm64-unsigned.zip
          dist/macos-validation.txt
          dist/MAC_THIRD_PARTY_LICENSES.json
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: ${{ inputs.artifact-name }}-diagnostics
        if-no-files-found: ignore
        path: dist/macos-validation.txt
