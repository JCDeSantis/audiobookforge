name: Validate

on:
  push:
    branches:
      - master
      - main
      - codex/docker-web-platform
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows regression and production build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --quiet
      - run: npm run build

  server:
    name: Linux server boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install without desktop native lifecycle scripts
        run: npm ci --ignore-scripts
      - run: npx vitest run src/core src/server src/shared
      - run: npm run build:web
      - run: npm run build:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-cpu:
    name: Universal image on CPU-only host
    runs-on: ubuntu-24.04
    # A cold PR cache can spend most of an hour compiling both Whisper variants
    # and exporting the reusable max-mode cache. Warm runs remain a few minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build the universal CPU/CUDA image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: audiobookforge:ci
          cache-from: type=gha,scope=universal-linux-amd64
          cache-to: type=gha,mode=max,scope=universal-linux-amd64
      - name: Start without an NVIDIA runtime
        run: >-
          docker run --detach --name audiobookforge-ci
          --publish 127.0.0.1:3000:3000
          --env ABF_WEB_PASSWORD=ci-password
          audiobookforge:ci
      - name: Wait for authenticated web runtime health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker logs audiobookforge-ci
          exit 1
      - name: Confirm CPU-only startup did not require NVIDIA
        run: docker inspect --format='{{.State.Running}}' audiobookforge-ci | grep true
      - name: Confirm runtime excludes package-manager tooling
        run: docker run --rm --entrypoint sh audiobookforge:ci -c 'node --version && ! command -v npm && ! command -v corepack && test ! -d /usr/local/lib/node_modules'
      - name: CPU transcription smoke test
        run: bash scripts/smoke-docker.sh audiobookforge:ci cpu
      - name: Scan high and critical vulnerabilities before tagging
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: audiobookforge:ci
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '1'
          format: table
          output: docker-security.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docker-security
          path: docker-security.txt
      - name: Show container logs on failure
        if: failure()
        run: docker logs audiobookforge-ci
